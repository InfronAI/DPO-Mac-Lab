name: CPU regression checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU PyTorch and project
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Mathematical and data regressions
        run: python -m pytest -q
      - name: Offline end-to-end CPU workflow
        env:
          HF_HUB_OFFLINE: '1'
        run: |
          python -m dpo_lab run --config experiments/smoke.json --output artifacts/ci-smoke --device cpu
          python scripts/validate_results.py artifacts/ci-smoke
