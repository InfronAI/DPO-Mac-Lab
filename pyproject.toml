[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpo-mac-lab"
version = "0.1.0"
description = "The original DPO objective with reproducible Apple Silicon experiments"
requires-python = ">=3.10,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
packages = ["dpo_lab"]
py-modules = ["trainers", "utils", "preference_datasets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
dpo-lab = "dpo_lab.cli:main"
